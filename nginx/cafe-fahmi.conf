server {
    listen 80;
    listen [::]:80;

    # Ganti dengan domain atau IP VPS kamu
    server_name coffefahmi.site www.coffefahmi.site;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Max upload size (untuk upload gambar menu/gallery) ────
    client_max_body_size 10M;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Frontend (React SPA - Static Files) ───────────────────
    root /var/www/cafe-fahmi/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets (JS, CSS, images) ─────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend API (Reverse Proxy ke PM2) ────────────────────
    # Frontend memanggil /api/auth/login → nginx strip /api → backend menerima /auth/login
    location /api/ {
        proxy_pass http://127.0.0.1:5005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Uploaded Files (Gambar menu, gallery, dll) ─────────────
    # /uploads/Menu/gambar.jpg → /var/www/cafe-fahmi/backend/uploads/Menu/gambar.jpg
    location /uploads/ {
        alias /var/www/cafe-fahmi/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── Deny access to hidden files ───────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Access & Error Logs ───────────────────────────────────
    access_log /var/log/nginx/cafe-fahmi-access.log;
    error_log /var/log/nginx/cafe-fahmi-error.log;
}

# ============================================================
# Setelah setup SSL dengan Certbot, jalankan:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot akan otomatis menambahkan konfigurasi SSL di atas.
# ============================================================
